name: Specs Sync (public)

on:
  push:
    branches:
      - main
    paths:
      - "shared/specs/**"
      - "frontend/public/specs/**"
      - "scripts/sync_public_specs.py"
  pull_request:
    paths:
      - "shared/specs/**"
      - "frontend/public/specs/**"
      - "scripts/sync_public_specs.py"

jobs:
  sync-public-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frontend/public/specs is synced
        run: python3 scripts/sync_public_specs.py --check

